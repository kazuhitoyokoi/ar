<!DOCTYPE html>
<html lang="en">

<title>AR App Live Editor</title>

body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;overflow:hidden;height:100vh;display:flex;background:#1e1e1e;color:#ccc}
#editor-pane{width:500px;min-width:200px;display:flex;flex-direction:column;flex-shrink:0}
#divider{width:4px;background:#3c3c3c;cursor:col-resize;flex-shrink:0;transition:background .15s}

#preview-pane{flex:1;display:flex;flex-direction:column;overflow:hidden}
.pane-bar{height:32px;background:#2d2d2d;border-bottom:1px solid #3c3c3c;display:flex;align-items:center;font-size:12px;color:#999;flex-shrink:0;padding:0 2px}

.pane-bar .btn:hover{background:#444;color:#fff}
.tab-scroll-btn{background:none;border:none;color:#555;font-size:11px;cursor:pointer;padding:0 4px;line-height:32px;flex-shrink:0;transition:color .15s}
.tab-scroll-btn:hover{color:#ccc}
.tab-bar{display:flex;align-items:stretch;height:100%;overflow-x:auto;overflow-y:hidden;flex-shrink:1;scroll-behavior:smooth}
.tab-bar::-webkit-scrollbar{height:0}
.dtab{display:flex;align-items:stretch;height:100%;border-bottom:2px solid transparent;transition:background .15s,border-color .15s;cursor:pointer;user-select:none;flex-shrink:0}
.dtab:hover{background:#333}
.dtab.active{border-bottom-color:#007acc;background:#1e1e1e}
.dtab.active .dtab-label{color:#e0e0e0}
.dtab.active .dtab-close{color:#999}
.dtab.active .popup-btn{color:#aaa}
.dtab.drag-over-left{box-shadow:inset 3px 0 0 #007acc}
.dtab.drag-over-right{box-shadow:inset -3px 0 0 #007acc}
.dtab.dragging{opacity:.4}
.dtab:focus{outline:none}
.dtab-label{color:#888;font-size:12px;padding:0 8px;display:flex;align-items:center;gap:4px;white-space:nowrap;letter-spacing:.3px}

.dtab-close:hover{color:#ccc;background:rgba(255,255,255,.1)}
.popup-btn{background:none;border:none;color:#555;font-size:13px;cursor:pointer;padding:0 6px 0 0;line-height:1;transition:color .2s;display:flex;align-items:center}
.popup-btn:hover{color:#ccc}
.tab-sep{width:1px;background:#3c3c3c;margin:6px 0;flex-shrink:0}
.dtab-add{border-bottom:none!important;flex-shrink:0}
.dtab-add .dtab-label{font-size:16px;color:#666;padding:0 10px}
.dtab-add:hover .dtab-label{color:#ccc}
.rename-input{background:#1e1e1e;color:#e0e0e0;border:1px solid #007acc;outline:none;font-size:12px;padding:1px 4px;font-family:inherit;border-radius:2px}
#editor-container{flex:1;position:relative;overflow:hidden}
#fallback-editor{width:100%;height:100%;background:#1e1e1e;color:#d4d4d4;border:none;outline:none;padding:12px;font-family:'Consolas','Courier New','Monaco',monospace;font-size:14px;resize:none;tab-size:2;white-space:pre;overflow:auto}
#preview-content{flex:1;position:relative;overflow:hidden}
#preview-content iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:none;background:#222}
#html-code-wrap{position:absolute;top:0;left:0;right:0;bottom:0;display:none}
#html-code-container{width:100%;height:100%}
#fallback-html-code{width:100%;height:100%;background:#1e1e1e;color:#d4d4d4;border:none;outline:none;padding:12px;font-family:'Consolas','Courier New','Monaco',monospace;font-size:13px;resize:none;tab-size:2;white-space:pre;overflow:auto}
#error-bar{display:none!important;background:#5a1d1d;color:#f48771;padding:6px 12px;font-size:12px;font-family:'Consolas','Courier New',monospace;max-height:60px;overflow-y:auto;white-space:pre-wrap;word-break:break-all;flex-shrink:0}
#xsl-drop-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.75);z-index:1000;justify-content:center;align-items:center}
#xsl-drop-overlay.show{display:flex}
#xsl-drop-box{background:#2d2d2d;border:2px dashed #007acc;border-radius:12px;padding:36px 56px;text-align:center;max-width:480px}
#xsl-drop-box h2{color:#e0e0e0;font-size:17px;margin-bottom:10px}
#xsl-drop-box p{color:#999;font-size:13px;margin-bottom:14px;line-height:1.6}
#xsl-drop-box code{background:#1e1e1e;padding:2px 6px;border-radius:3px;font-size:12px}
#xsl-pick-btn{background:#0e639c;color:#fff;border:none;padding:7px 22px;border-radius:4px;font-size:13px;cursor:pointer;font-family:inherit}
#xsl-pick-btn:hover{background:#1177bb}
#xsl-drop-box .or{color:#666;font-size:11px;margin:8px 0}
.drop-highlight{outline:2px dashed #007acc;outline-offset:-4px}
</style>
</head>
